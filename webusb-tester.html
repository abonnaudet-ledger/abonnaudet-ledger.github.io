<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger WebUSB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ── Tokens ── */
:root {
  --bg:        #090C14;
  --surface:   #111622;
  --elevated:  #181E2E;
  --border:    #20293C;
  --border-hi: #2E3A52;
  --accent:    #4F8AF4;
  --accent-lo: rgba(79,138,244,.12);
  --rx:        #2FCA8E;
  --rx-lo:     rgba(47,202,142,.12);
  --err:       #EF5350;
  --err-lo:    rgba(239,83,80,.10);
  --warn:      #F0A32A;
  --text:      #C5D0EB;
  --text-2:    #6B7A9E;
  --text-3:    #3A4560;
  --ui:        'IBM Plex Sans', system-ui, sans-serif;
  --mono:      'JetBrains Mono', 'Fira Code', monospace;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #EEF1F8;
    --surface:   #FFFFFF;
    --elevated:  #F4F7FC;
    --border:    #D5DCF0;
    --border-hi: #B8C4DF;
    --accent:    #2461E8;
    --accent-lo: rgba(36,97,232,.10);
    --rx:        #0E9966;
    --rx-lo:     rgba(14,153,102,.10);
    --err:       #D43535;
    --err-lo:    rgba(212,53,53,.08);
    --warn:      #C07A10;
    --text:      #1C2440;
    --text-2:    #5A6480;
    --text-3:    #B0BAD4;
  }
}
:root[data-theme="dark"] {
  --bg:#090C14;--surface:#111622;--elevated:#181E2E;--border:#20293C;--border-hi:#2E3A52;
  --accent:#4F8AF4;--accent-lo:rgba(79,138,244,.12);--rx:#2FCA8E;--rx-lo:rgba(47,202,142,.12);
  --err:#EF5350;--err-lo:rgba(239,83,80,.10);--warn:#F0A32A;
  --text:#C5D0EB;--text-2:#6B7A9E;--text-3:#3A4560;
}
:root[data-theme="light"] {
  --bg:#EEF1F8;--surface:#FFFFFF;--elevated:#F4F7FC;--border:#D5DCF0;--border-hi:#B8C4DF;
  --accent:#2461E8;--accent-lo:rgba(36,97,232,.10);--rx:#0E9966;--rx-lo:rgba(14,153,102,.10);
  --err:#D43535;--err-lo:rgba(212,53,53,.08);--warn:#C07A10;
  --text:#1C2440;--text-2:#5A6480;--text-3:#B0BAD4;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.5;
}

body {
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
  min-height: 100svh;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}

.logo-mark svg { display: block; }

h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--text);
}

.badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--elevated);
  border: 1px solid var(--border);
  color: var(--text-2);
  letter-spacing: .04em;
}

header .spacer { flex: 1; }

.status-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-2);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  transition: background .3s;
}
.dot.connected { background: var(--rx); box-shadow: 0 0 6px var(--rx); }
.dot.error { background: var(--err); }

.btn-icon {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s;
  flex-shrink: 0;
}
.btn-icon:hover { border-color: var(--border-hi); color: var(--text); }
.btn-icon svg { display: block; }

/* ── Main layout ── */
.main {
  display: flex;
  gap: 12px;
  flex: 1;
  min-height: 0;
}

/* ── Sidebar ── */
.sidebar {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.panel-head {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-2);
}

.panel-body { padding: 12px; }

/* ── Device panel ── */
.device-placeholder {
  text-align: center;
  padding: 20px 12px;
}

.device-placeholder p {
  color: var(--text-2);
  font-size: 12px;
  margin-top: 6px;
  line-height: 1.4;
}

.kv-list { display: flex; flex-direction: column; gap: 6px; }

.kv {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.kv-key {
  font-size: 11px;
  color: var(--text-2);
  flex-shrink: 0;
}

.kv-val {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  text-align: right;
  word-break: break-all;
}

.ep-row {
  display: flex;
  gap: 6px;
  margin-top: 4px;
}

.ep-chip {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--elevated);
  color: var(--text-2);
}

.ep-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-lo); }

/* ── Connect button ── */
.btn {
  width: 100%;
  padding: 8px 14px;
  border-radius: 6px;
  font-family: var(--ui);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .15s, background .15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: none;
}

.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { opacity: .85; }

.btn-danger {
  background: var(--err-lo);
  color: var(--err);
  border: 1px solid var(--err);
}
.btn-danger:hover:not(:disabled) { background: var(--err); color: #fff; }

.btn-send {
  background: var(--accent);
  color: #fff;
  flex-shrink: 0;
  width: auto;
  padding: 7px 14px;
}
.btn-send:hover:not(:disabled) { opacity: .85; }

/* ── APDU Composer ── */
.composer { display: flex; flex-direction: column; gap: 10px; }

.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  letter-spacing: .03em;
}

.hex-input {
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--elevated);
  color: var(--text);
  width: 100%;
  outline: none;
  transition: border-color .15s;
  resize: vertical;
  min-height: 68px;
}
.hex-input:focus { border-color: var(--accent); }
.hex-input::placeholder { color: var(--text-3); }

.hex-input.error-state { border-color: var(--err); }

.apdu-preview {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-2);
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 8px;
  word-break: break-all;
  line-height: 1.7;
  min-height: 36px;
}

.apdu-preview .byte-cla { color: var(--warn); }
.apdu-preview .byte-ins { color: var(--accent); }
.apdu-preview .byte-p1p2 { color: var(--rx); }
.apdu-preview .byte-data { color: var(--text); }
.apdu-preview .byte-len { color: var(--text-2); }

.send-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.presets-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.preset-btn {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--elevated);
  color: var(--text-2);
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.preset-btn:hover { border-color: var(--accent); color: var(--accent); }

.field-hint {
  font-size: 10px;
  color: var(--text-2);
  margin-top: 2px;
}

/* ── Log panel ── */
.log-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.log-panel .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.log-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.log-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-2);
}

.log-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-family: var(--mono);
  font-size: 11.5px;
}

.log-body::-webkit-scrollbar { width: 5px; }
.log-body::-webkit-scrollbar-track { background: transparent; }
.log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.log-entry {
  display: grid;
  grid-template-columns: 60px 28px 1fr;
  gap: 6px;
  align-items: baseline;
  padding: 5px 6px;
  border-radius: 4px;
  border-left: 2px solid transparent;
}

.log-entry:hover { background: var(--elevated); }

.log-entry.tx {
  border-left-color: var(--accent);
}
.log-entry.rx {
  border-left-color: var(--rx);
}
.log-entry.info {
  border-left-color: var(--border-hi);
}
.log-entry.err {
  border-left-color: var(--err);
  background: var(--err-lo);
}

.log-ts {
  color: var(--text-3);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}

.log-tag {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.tx .log-tag { color: var(--accent); }
.rx .log-tag { color: var(--rx); }
.info .log-tag { color: var(--text-2); }
.err .log-tag { color: var(--err); }

.log-hex { color: var(--text); word-break: break-all; line-height: 1.6; }

.log-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--text-3);
  font-family: var(--ui);
}

.log-empty-icon { opacity: .3; }

/* ── SW ── */
.sw-ok { color: var(--rx); }
.sw-err { color: var(--err); }
.sw-warn { color: var(--warn); }

/* ── Responsive ── */
@media (max-width: 680px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="5" height="5" rx="1" fill="white" opacity=".9"/>
        <rect x="9" y="2" width="5" height="5" rx="1" fill="white" opacity=".5"/>
        <rect x="2" y="9" width="5" height="5" rx="1" fill="white" opacity=".5"/>
        <rect x="9" y="9" width="5" height="5" rx="1" fill="white" opacity=".25"/>
      </svg>
    </div>
    <h1>Ledger WebUSB</h1>
    <span class="badge">EP 0x83/0x03</span>
  </div>
  <div class="spacer"></div>
  <div class="status-pill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Déconnecté</span>
  </div>
  <button class="btn-icon" id="themeToggle" title="Basculer le thème" aria-label="Basculer le thème">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 1v1M7 12v1M1 7h1M12 7h1M3.22 3.22l.71.71M10.07 10.07l.71.71M3.22 10.78l.71-.71M10.07 3.93l.71-.71" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="btn-icon" id="clearBtn" title="Vider le log" aria-label="Vider le log">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M2 3.5h10M5.5 3.5V2.5h3v1M11 3.5l-.7 8H3.7L3 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Device -->
    <div class="panel" id="devicePanel">
      <div class="panel-head">
        <span class="panel-title">Device</span>
        <button class="btn btn-danger" id="disconnectBtn" style="display:none;width:auto;padding:3px 10px;font-size:11px">Déconnecter</button>
      </div>
      <div id="deviceContent">
        <div class="device-placeholder">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" opacity=".25">
            <rect x="6" y="10" width="24" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 18h12M18 14v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>Aucun device connecté</p>
        </div>
        <div style="padding: 0 12px 12px">
          <button class="btn btn-primary" id="connectBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 7h8M8 4l3 3-3 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Connecter un device
          </button>
        </div>
      </div>
    </div>

    <!-- Composer -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">APDU Composer</span>
      </div>
      <div class="panel-body">
        <div class="composer">

          <div class="field">
            <label>Presets</label>
            <div class="presets-row">
              <button class="preset-btn" data-apdu="B0010000" title="CLA=0xB0 INS=0x01 — retourne nom+version (OS ou app)">GET_VERSION</button>
              <button class="preset-btn" data-apdu="B0A70000" title="CLA=0xB0 INS=0xA7 — quitte l'app en cours">APP_EXIT</button>
              <button class="preset-btn" data-apdu="B0020000" title="CLA=0xB0 INS=0x02 — hash de clé publique (HAVE_SEED_COOKIE requis)">GET_SEED_COOKIE</button>
              <button class="preset-btn" data-apdu="B0570000" title="CLA=0xB0 INS=0x57 P1=0x00 — init mesure stack (DEBUG_OS_STACK_CONSUMPTION requis)">STACK_INIT</button>
              <button class="preset-btn" id="longApduBtn" title="CLA=0xE0 INS=0xFF — 255 octets 0xA5 (APDU de perf)">PERF 255B</button>
            </div>
          </div>

          <div class="field">
            <label for="apduInput">APDU (hex)</label>
            <textarea class="hex-input" id="apduInput" placeholder="E0 01 00 00&#10;ou E0010000" spellcheck="false" autocomplete="off"></textarea>
            <span class="field-hint">CLA INS P1 P2 [Lc Data] [Le]</span>
          </div>

          <div class="send-row">
            <button class="btn btn-send" id="sendBtn" disabled>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <path d="M1 6.5h11M7.5 2.5L11.5 6.5l-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Envoyer
            </button>
            <span id="sendHint" style="font-size:11px;color:var(--text-2)">Connectez d'abord un device</span>
          </div>

        </div>
      </div>
    </div>

  </aside>

  <!-- Log -->
  <div class="log-panel">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">Log des échanges</span>
        <div class="log-controls">
          <span class="log-count" id="logCount">0 entrée</span>
        </div>
      </div>
      <div class="log-body" id="logBody">
        <div class="log-empty">
          <svg class="log-empty-icon" width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="6" y="8" width="28" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 16h16M12 21h10M12 26h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>En attente d'échanges…</span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── State ──
let device = null;
let iface = null;
let epIn = null;
let epOut = null;
let logEntries = 0;
let theme = 'system';

// ── DOM refs ──
const connectBtn    = document.getElementById('connectBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const sendBtn       = document.getElementById('sendBtn');
const sendHint      = document.getElementById('sendHint');
const apduInput     = document.getElementById('apduInput');
const logBody       = document.getElementById('logBody');
const logCount      = document.getElementById('logCount');
const statusDot     = document.getElementById('statusDot');
const statusText    = document.getElementById('statusText');
const themeToggle   = document.getElementById('themeToggle');
const clearBtn      = document.getElementById('clearBtn');
const deviceContent = document.getElementById('deviceContent');

// ── Theme ──
themeToggle.addEventListener('click', () => {
  const root = document.documentElement;
  if (theme === 'system') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
  } else {
    theme = theme === 'dark' ? 'light' : 'dark';
  }
  root.setAttribute('data-theme', theme);
});

// ── Parse hex input ──
function parseHex(str) {
  const clean = str.replace(/\s+/g, '').toUpperCase();
  if (!/^[0-9A-F]*$/.test(clean)) return null;
  if (clean.length % 2 !== 0) return null;
  const bytes = [];
  for (let i = 0; i < clean.length; i += 2) {
    bytes.push(parseInt(clean.slice(i, i+2), 16));
  }
  return bytes;
}

function toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

// ── APDU preview ──
apduInput.addEventListener('input', updatePreview);

function updatePreview() {
  const bytes = parseHex(apduInput.value);
  apduInput.classList.toggle('error-state', apduInput.value.trim() && !bytes);
}

// ── Framing ──
const CHANNEL = [0x01, 0x01];
const TAG_APDU = 0x05;
const PACKET_SIZE = 64;

function frameAPDU(apduBytes) {
  const packets = [];
  let seq = 0;
  let offset = 0;

  // First packet: [channel(2)] [tag(1)] [seq(2)] [len(2)] [data...]
  const p0 = new Uint8Array(PACKET_SIZE);
  p0[0]=CHANNEL[0]; p0[1]=CHANNEL[1]; p0[2]=TAG_APDU;
  p0[3]=(seq>>8)&0xFF; p0[4]=seq&0xFF;
  p0[5]=(apduBytes.length>>8)&0xFF; p0[6]=apduBytes.length&0xFF;
  const chunk0 = apduBytes.slice(0, PACKET_SIZE - 7);
  p0.set(chunk0, 7);
  packets.push(p0);
  offset = chunk0.length;
  seq++;

  while (offset < apduBytes.length) {
    const pN = new Uint8Array(PACKET_SIZE);
    pN[0]=CHANNEL[0]; pN[1]=CHANNEL[1]; pN[2]=TAG_APDU;
    pN[3]=(seq>>8)&0xFF; pN[4]=seq&0xFF;
    const chunkN = apduBytes.slice(offset, offset + PACKET_SIZE - 5);
    pN.set(chunkN, 5);
    packets.push(pN);
    offset += chunkN.length;
    seq++;
  }

  return packets;
}

function parseResponse(packets) {
  if (!packets.length) return null;
  const first = new Uint8Array(packets[0]);
  const total = (first[5] << 8) | first[6];
  const result = new Uint8Array(total);
  let offset = 0;

  const d0 = first.slice(7, 7 + Math.min(total, PACKET_SIZE - 7));
  result.set(d0); offset += d0.length;

  for (let i = 1; i < packets.length && offset < total; i++) {
    const pkt = new Uint8Array(packets[i]);
    const chunk = pkt.slice(5, 5 + (total - offset));
    result.set(chunk, offset);
    offset += chunk.length;
  }
  return result;
}

// ── Log ──
clearBtn.addEventListener('click', () => {
  logEntries = 0;
  logBody.innerHTML = `
    <div class="log-empty">
      <svg class="log-empty-icon" width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="6" y="8" width="28" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 16h16M12 21h10M12 26h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>En attente d'échanges…</span>
    </div>`;
  updateCount();
});

function updateCount() {
  logCount.textContent = logEntries === 0 ? '0 entrée'
    : logEntries === 1 ? '1 entrée'
    : `${logEntries} entrées`;
}

function addLog(type, content) {
  const empty = logBody.querySelector('.log-empty');
  if (empty) empty.remove();

  const now = new Date();
  const ts = now.toTimeString().slice(0,8) + '.' + String(now.getMilliseconds()).padStart(3,'0');
  const tags = { tx:'TX', rx:'RX', info:'INFO', err:'ERR' };

  const el = document.createElement('div');
  el.className = `log-entry ${type}`;
  el.innerHTML = `
    <span class="log-ts">${ts}</span>
    <span class="log-tag">${tags[type]||type}</span>
    <span class="log-hex">${content}</span>`;
  logBody.appendChild(el);
  logEntries++;
  updateCount();
  logBody.scrollTop = logBody.scrollHeight;
}

// ── SW decode ──
function swDescription(sw) {
  const map = {
    '9000': 'OK', '6700': 'Wrong length', '6982': 'Security not satisfied',
    '6985': 'Conditions not satisfied', '6A80': 'Incorrect data',
    '6A82': 'File not found', '6A86': 'Incorrect P1/P2',
    '6D00': 'INS not supported', '6E00': 'CLA not supported',
    '6F00': 'Unknown error'
  };
  return map[sw.toUpperCase()] || '';
}

function formatResponse(bytes) {
  if (!bytes || bytes.length < 2) return `<span style="color:var(--err)">Réponse invalide</span>`;
  const data = bytes.slice(0, -2);
  const sw = bytes.slice(-2);
  const swHex = Array.from(sw).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join('');
  const swOk = swHex === '9000';
  const swWarn = swHex.startsWith('61') || swHex.startsWith('6C');
  const swClass = swOk ? 'sw-ok' : swWarn ? 'sw-warn' : 'sw-err';
  const desc = swDescription(swHex);

  let html = '';
  if (data.length > 0) {
    html += `<span style="color:var(--text)">${toHex(data)}</span>  `;
  }
  html += `<span class="${swClass}">SW: ${swHex}${desc ? ' · ' + desc : ''}</span>`;
  return html;
}

// ── Find WebUSB interface ──
function findWebUSBInterface(dev) {
  for (const ifc of dev.configuration.interfaces) {
    for (const alt of ifc.alternates) {
      const hasIn  = alt.endpoints.some(e => e.endpointNumber === 3 && e.direction === 'in');
      const hasOut = alt.endpoints.some(e => e.endpointNumber === 3 && e.direction === 'out');
      if (hasIn && hasOut) {
        return {
          interfaceNumber: ifc.interfaceNumber,
          epIn:  alt.endpoints.find(e => e.endpointNumber === 3 && e.direction === 'in'),
          epOut: alt.endpoints.find(e => e.endpointNumber === 3 && e.direction === 'out'),
        };
      }
    }
  }
  return null;
}

// ── Device info panel ──
function renderDeviceInfo(dev, ifaceInfo) {
  deviceContent.innerHTML = `
    <div style="padding:12px">
      <div class="kv-list">
        <div class="kv">
          <span class="kv-key">Produit</span>
          <span class="kv-val">${dev.productName || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-key">VID / PID</span>
          <span class="kv-val">0x${dev.vendorId.toString(16).padStart(4,'0').toUpperCase()} / 0x${dev.productId.toString(16).padStart(4,'0').toUpperCase()}</span>
        </div>
        <div class="kv">
          <span class="kv-key">Série</span>
          <span class="kv-val">${dev.serialNumber || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-key">Interface</span>
          <span class="kv-val">#${ifaceInfo.interfaceNumber}</span>
        </div>
        <div class="kv">
          <span class="kv-key">Endpoints</span>
          <div class="ep-row">
            <span class="ep-chip active">OUT 0x03</span>
            <span class="ep-chip active">IN 0x83</span>
          </div>
        </div>
      </div>
    </div>
    <div style="padding:0 12px 12px">
      <div id="disconnectBtnWrap"></div>
    </div>`;
  disconnectBtn.style.display = 'flex';
}

// ── Connect ──
connectBtn.addEventListener('click', async () => {
  if (!navigator.usb) {
    addLog('err', 'WebUSB non supporté dans ce navigateur (requis: Chrome/Edge en HTTPS ou localhost)');
    return;
  }

  try {
    addLog('info', 'Sélection du device…');
    device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x2C97 }] });

    await device.open();
    addLog('info', `Device ouvert : ${device.productName || 'Ledger'}`);

    if (device.configuration === null) await device.selectConfiguration(1);

    const ifaceInfo = findWebUSBInterface(device);
    if (!ifaceInfo) {
      addLog('err', 'Interface WebUSB (EP3) introuvable — vérifiez que le device est en mode WebUSB');
      await device.close();
      device = null;
      return;
    }

    try {
      await device.claimInterface(ifaceInfo.interfaceNumber);
    } catch (e) {
      addLog('err', `claimInterface #${ifaceInfo.interfaceNumber} échoué : ${e.message}`);
      await device.close();
      device = null;
      return;
    }

    iface = ifaceInfo;
    epIn  = ifaceInfo.epIn;
    epOut = ifaceInfo.epOut;

    statusDot.className  = 'dot connected';
    statusText.textContent = device.productName || 'Connecté';
    sendBtn.disabled   = false;
    sendHint.style.display = 'none';
    renderDeviceInfo(device, ifaceInfo);
    addLog('info', `Interface #${ifaceInfo.interfaceNumber} revendiquée · EP OUT:0x03 IN:0x83`);

  } catch (e) {
    if (e.name !== 'NotFoundError') {
      addLog('err', e.message);
    }
  }
});

// ── Disconnect ──
disconnectBtn.addEventListener('click', async () => {
  if (!device) return;
  try {
    if (iface !== null) await device.releaseInterface(iface.interfaceNumber);
    await device.close();
  } catch (_) {}
  device = null; iface = null;
  statusDot.className = 'dot';
  statusText.textContent = 'Déconnecté';
  sendBtn.disabled = true;
  sendHint.style.display = '';
  deviceContent.innerHTML = `
    <div class="device-placeholder">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" opacity=".25">
        <rect x="6" y="10" width="24" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 18h12M18 14v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p>Aucun device connecté</p>
    </div>
    <div style="padding:0 12px 12px">
      <button class="btn btn-primary" id="connectBtnNew">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 7h8M8 4l3 3-3 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Connecter un device
      </button>
    </div>`;
  document.getElementById('connectBtnNew').addEventListener('click', () => connectBtn.click());
  disconnectBtn.style.display = 'none';
  addLog('info', 'Device déconnecté');
});

// ── Send ──
sendBtn.addEventListener('click', async () => {
  if (!device || !iface) return;
  const bytes = parseHex(apduInput.value);
  if (!bytes || bytes.length === 0) {
    apduInput.classList.add('error-state');
    return;
  }

  sendBtn.disabled = true;
  addLog('tx', toHex(bytes));

  try {
    const packets = frameAPDU(bytes);
    for (const pkt of packets) {
      await device.transferOut(epOut.endpointNumber, pkt);
    }

    // Receive all response packets
    const rxPackets = [];
    let seq = 0;
    let totalExpected = null;
    let received = 0;

    while (true) {
      const res = await device.transferIn(epIn.endpointNumber, PACKET_SIZE);
      if (!res.data || res.data.byteLength === 0) break;
      rxPackets.push(res.data);

      const view = new Uint8Array(res.data.buffer);
      if (seq === 0) {
        totalExpected = (view[5] << 8) | view[6];
        received += Math.min(res.data.byteLength - 7, totalExpected);
      } else {
        received += Math.min(res.data.byteLength - 5, totalExpected - received);
      }
      seq++;
      if (totalExpected !== null && received >= totalExpected) break;
    }

    const response = parseResponse(rxPackets.map(d => d.buffer));
    if (response) {
      addLog('rx', formatResponse(response));
    } else {
      addLog('err', 'Aucune réponse reçue');
    }

  } catch (e) {
    addLog('err', e.message);
    if (e.name === 'NotFoundError' || e.name === 'NetworkError') {
      statusDot.className = 'dot error';
      statusText.textContent = 'Déconnecté';
    }
  }

  sendBtn.disabled = false;
  sendBtn.focus();
});

// ── Keyboard shortcut ──
apduInput.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!sendBtn.disabled) sendBtn.click();
  }
});

// ── Presets ──
document.querySelectorAll('.preset-btn[data-apdu]').forEach(btn => {
  btn.addEventListener('click', () => {
    apduInput.value = btn.dataset.apdu;
    updatePreview();
    apduInput.focus();
  });
});

document.getElementById('longApduBtn').addEventListener('click', () => {
  apduInput.value = 'E0FF0000FF' + 'A5'.repeat(255);
  updatePreview();
  apduInput.focus();
});

// ── Init ──
updateCount();
sendHint.innerHTML = 'Ou <kbd style="font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;border:1px solid var(--border);background:var(--elevated)">⌘↵</kbd>';
</script>
</body>
</html>
